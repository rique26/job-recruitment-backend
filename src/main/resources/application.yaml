server:
  port: 8083

spring:
  application:
    name: job-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DATABASE_NAME:job}
    username: ${DATABASE_USERNAME:rique}
    password: ${DATABASE_PASSWORD:job1418}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  expiration: ${EXPIRATION-JWT:900000} # 15 minutes
  key: ${JWT_KEY}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG